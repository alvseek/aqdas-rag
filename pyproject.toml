[project]
name = "aqdas-rag"
version = "0.1.0"
description = "Structure-aware RAG over the Kitab-i-Aqdas, with verifiable citations"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "anthropic>=1.6.0",
    "beautifulsoup4>=4.12",
    "fastembed>=0.8.0",
    "fastmcp>=4.0.5",
    "lxml>=5.0",
    "numpy>=2.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqdas_rag"]
